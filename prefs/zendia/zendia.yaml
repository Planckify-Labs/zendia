- name: zendia.enabled
  value: true

- name: zendia.leader
  value: "<Space>"

- name: zendia.timeoutlen
  value: 300 # in milliseconds; LazyVim lowers vim's 1000 for which-key

- name: zendia.statusline.enabled
  value: true

- name: zendia.statusline.show
  value: "shrink" # once things are quiet, the mode indicator shrinks to a small badge ("shrink"), stays up ("always"), or hides until the next change ("change"); zendia.statusline.enabled turns it off

- name: zendia.ublock.enabled
  value: true # install uBlock Origin from AMO when it is missing; turned off when the user removes it

- name: zendia.agent.default
  value: "" # an agent id (claude, codex, cursor, antigravity, opencode, kiro); empty picks the first installed

- name: zendia.agent.layout
  value: "float" # float over the page, slide in from the side and hide when the mouse leaves, or split beside the tab

- name: zendia.agent.side
  value: "right" # the side the agent panel slides in from: left or right

- name: zendia.agent.width
  value: 420 # the agent panel's width, in pixels; dragging its inner edge sets it, and it never gets narrower than 420

- name: zendia.agent.split-fallback
  value: "float" # how a split agent panel lays out while the tab has no room for it: float or slide

- name: zendia.agent.stealFocus
  value: false # let agents (and the pages they drive) bring tabs to the front; off, agents work their tabs in the background and never touch the user's cursor, focus, window or view

- name: zendia.agents.layout
  value: "float" # the agents panel, every agent's work in one list: float over the page, slide in from the side and hide when the mouse leaves, or split beside the tab

- name: zendia.agents.side
  value: "left" # the side the agents panel slides in from: left or right

- name: zendia.agents.width
  value: 340 # the agents panel's width, in pixels; dragging its inner edge sets it, and it never gets narrower than 280

- name: zendia.agents.split-fallback
  value: "float" # how a split agents panel lays out while the tab has no room for it: float or slide

- name: zendia.webchat.default
  value: "" # a web chat site's id (chatgpt, claude, gemini, kimi, grok, deepseek, perplexity, copilot, or one you added); the last one used is kept here

- name: zendia.webchat.accounts
  value: "" # JSON of the accounts added to each chat site and the one in use, kept by the web chat panel's accounts menu

- name: zendia.webchat.custom
  value: "" # JSON array of your own chat sites, [{"id": "mistral", "name": "Le Chat", "url": "https://chat.mistral.ai/"}]; an entry with a built-in id changes it, {"id": "grok", "hidden": true} hides it

- name: zendia.webchat.layout
  value: "float" # float over the page, slide in from the side and hide when the mouse leaves, or split beside the tab

- name: zendia.webchat.side
  value: "right" # the side the web chat panel slides in from: left or right

- name: zendia.webchat.width
  value: 480 # the web chat panel's width, in pixels; dragging its inner edge sets it, and it never gets narrower than 420

- name: zendia.webchat.split-fallback
  value: "float" # how a split web chat panel lays out while the tab has no room for it: float or slide

- name: zendia.webchat.ask.menu
  value: true # "Ask ChatGPT" in the page's and the tabs' context menus: explain, translate or summarize what you right-click in the web chat panel

- name: zendia.webchat.ask.newChatPerPage
  value: true # each page asked about gets a new chat; asking about the same page again keeps its chat

- name: zendia.webchat.prompts
  value: "" # JSON array of your own prompts, [{"id": "eli5", "label": "Explain Like I'm Five", "key": "5", "on": ["selection"], "prompt": "Explain simply:\n\n{{quote}}"}]; an entry with a built-in id changes it ({"id": "factcheck", "site": "perplexity"}), "hidden": true hides it. Placeholders: {{text}} {{quote}} {{context}} {{title}} {{url}} {{source}} {{page}} {{lang}} {{tabs}}

- name: zendia.webchat.translate.recent
  value: "" # the languages picked last in "Ask ChatGPT", newest first, as codes separated by commas; the first one is what answers (summaries, explanations, descriptions) and translations are written in

- name: zendia.theme
  value: "" # JSON overrides for zendia's colors, see ui/ZendiaTheme.sys.mjs

- name: zendia.agent.log.enabled
  value: true # a JSONL trace per conversation in <profile>/zendia/agent/logs, <leader>al opens it

- name: zendia.agent.log.stdout
  value: false # also a one-line summary per entry on stdout; npm run dev turns it on

- name: zendia.agent.network
  value: true # agents read the requests a page made (network_list, network_read); recording starts when the agent panel first opens and keeps the latest 300 requests per tab, text bodies up to 1 MB each, 24 MB in all

- name: zendia.agent.a11y
  value: false # agents read control names, descriptions and states from Gecko's accessibility tree; off by default: it keeps the engine on in the page's process (tens of MB, slower loads) and adds about 1% to what an agent reads
