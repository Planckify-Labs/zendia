<!-- The onboarding's pages. ZenWelcome.mjs shows this in a frame over the
     browser window and removes the frame when the onboarding ends, which
     frees React and its 2D stage with it. The interface is built from
     tools/zendia-welcome. -->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src chrome:; object-src 'none'; img-src chrome: resource: moz-icon: moz-extension: data: blob:"
    />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="zendia-welcome-start"></title>
    <link rel="localization" href="branding/brand.ftl" />
    <link rel="localization" href="browser/zen-general.ftl" />
    <link rel="localization" href="browser/zen-welcome.ftl" />
    <link
      rel="stylesheet"
      href="chrome://browser/content/zen-styles/zendia-welcome.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script
      type="module"
      src="chrome://browser/content/zen-vendor/zendia-welcome.min.mjs"
    ></script>
  </body>
</html>
